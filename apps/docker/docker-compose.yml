# The public side of Music Studio: the app and the reverse proxy.
#   docker compose --env-file .env up -d
# The graphics-card worker runs on the box, not here:
#   systemctl start selfhostaudio-worker
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      SERVE_MEDIA: "0"          # caddy serves the audio; python answers JSON only
    volumes:
      - ${DATA_DIR:-../../data}:/data
    expose: ["8095"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-../../data}:/data:ro
      - ../frontend:/srv/frontend:ro
      - caddy_data:/data/caddy
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
